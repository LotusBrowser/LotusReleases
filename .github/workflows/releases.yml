name: Publish Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Create releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob

          for dir in */; do
            VERSION="${dir%/}"

            # Match x.y.z folder names
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue

            INSTALLER="$VERSION/Lotus.Installer.exe"

            if [ ! -f "$INSTALLER" ]; then
              echo "No installer found for $VERSION"
              continue
            fi

            echo "Processing $VERSION"

            # Create release if missing
            if ! gh release view "$VERSION" >/dev/null 2>&1; then
              gh release create "$VERSION" \
                --title "$VERSION" \
                --generate-notes
            fi

            # Upload installer (overwrite if already exists)
            gh release upload "$VERSION" \
              "$INSTALLER" \
              --clobber
          done